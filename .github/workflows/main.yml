name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  mission-database:
    name: Decode a recorded housekeeping frame
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: ./mvnw -B compile

      - name: Start Yamcs and decode the recorded frame
        run: |
          # Start Yamcs and run the check in one step, so the server is still
          # running for the check.
          ./mvnw -B yamcs:run > yamcs.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://localhost:8090/api/mdb/kfsw >/dev/null && break
            sleep 2
          done
          if ! curl -sf http://localhost:8090/api/mdb/kfsw >/dev/null; then
            echo "Yamcs did not answer within three minutes"
            tail -80 yamcs.log
            exit 1
          fi
          ./scripts/check-mdb.sh

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yamcs-log
          path: yamcs.log
