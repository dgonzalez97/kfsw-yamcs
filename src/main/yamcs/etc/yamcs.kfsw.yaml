# The K-FSW instance: one telemetry link, one mission database, no commanding.
#
# Samples come from the bridge in k-fsw (tools/ground/hk-bridge.py), which polls
# nodes over CSP or listens for beacons and forwards each sample to the UDP link
# below.

services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService

dataLinks:
  - name: hk-udp
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_realtime
    port: 10015
    # The bridge adds an 8-byte time and a 4-byte count in front of every frame,
    # the sizes this preprocessor reads, so each sample keeps its own time.
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      byteOrder: BIG_ENDIAN
      timestampOffset: 0
      seqCountOffset: 8

mdb:
  # Generated by tools/ground/hk-report.py from ground-station/reports in k-fsw,
  # the same file that gives the node its hk define command.
  - type: xtce
    args:
      file: mdb/kfsw-hk.xml

streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
