# The K-FSW instance: one telemetry link, one mission database, no commanding.
#
# Housekeeping is pull-only, so nothing arrives here on its own. The bridge in
# k-fsw (tools/ground/hk-bridge.py) asks a node for samples over CSP and
# forwards each one to the UDP link below.

services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService

dataLinks:
  - name: hk-udp
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_realtime
    port: 10015
    # The bridge puts an 8-byte time and a 4-byte count in front of every frame
    # because that is the shape this preprocessor reads them in, and the
    # housekeeping header carries 4 bytes and 2. Without it a pull of sixteen
    # samples would land at one reception instant and the history the node kept
    # would collapse into a single moment in the archive.
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      byteOrder: BIG_ENDIAN
      timestampOffset: 0
      seqCountOffset: 8

mdb:
  # Generated from ground-station/reports in k-fsw by tools/ground/hk-report.py.
  # The same file emits the `hk define` command the node is given, which is what
  # keeps the two ends of a nameless wire format agreeing.
  - type: xtce
    args:
      file: mdb/kfsw-hk.xml

streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
